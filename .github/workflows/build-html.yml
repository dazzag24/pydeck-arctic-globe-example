name: Build visualization

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --locked

      - name: Generate HTML
        run: uv run main.py

      - name: Upload visualization
        uses: actions/upload-artifact@v4
        with:
          name: arctic-globe-view
          path: arctic_globe_view.html
          if-no-files-found: error